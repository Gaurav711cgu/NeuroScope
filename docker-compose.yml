version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neuroscope_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuroscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/neuroscope/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuroscope"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroscope_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/neuroscope
      NEUROSCOPE_MODEL: gpt2
      NEUROSCOPE_SAE_RELEASE: gpt2-small-res-jb
      NEUROSCOPE_SAE_LAYER: 7
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroscope_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
