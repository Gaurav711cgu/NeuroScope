name: NeuroScope Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: neuroscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest bandit
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Code Quality & Formatting Check (Ruff)
        run: |
          ruff check backend/ --ignore E501,F401,E402

      - name: Security Vulnerability Scan (Bandit)
        run: |
          bandit -r backend/ -ll -ii --exclude backend/tests,backend/scratch_verify*.py

      - name: Verify Core Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/neuroscope
        run: |
          if [ -d backend/tests ]; then pytest backend/tests/ -v; fi

      - name: Execute Full System Integration Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/neuroscope
        run: |
          python backend/scratch_verify_v3.py
          python backend_test.py

  frontend-build:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Application
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci || npm install
            npm run build
          fi

  docker-build-check:
    name: Container Build Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: |
          if [ -f Dockerfile ]; then
            docker build -t neuroscope-backend:ci .
          fi
